name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    name: Ruff (lint)
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ['3.10', '3.11', '3.12'] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # важно для hatch-vcs (видеть теги, даже если тут не билдим)
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m ruff check src tests

  types:
    name: Mypy (types)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix: { python-version: ['3.10', '3.11', '3.12'] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m mypy src tests

  tests:
    name: Pytest (unit)
    runs-on: ubuntu-latest
    needs: [lint, types]
    strategy:
      matrix: { python-version: ['3.10', '3.11', '3.12'] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m pytest -q tests

  build:
    name: Build dist/ (no publish)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # чтобы hatch-vcs определил версию из тегов
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
